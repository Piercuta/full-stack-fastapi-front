# Build the Vite site, pass dist/ as an artifact, then sync to S3 and
# invalidate CloudFront. Infra values come from SSM Parameter Store:
#   /<project>/<env>/<key>  e.g. /test-k8s/dev/site_bucket_name
#
#   push `dev`              → build + deploy automatically (environment `dev`)
#   push `master` / `main`  → build + deploy (manual play button, environment `prod`)
#   git tag                 → build + deploy (manual play button, environment `prod`)
#
# GitLab CI/CD variables:
#   AWS_ACCESS_KEY_ID      (masked)
#   AWS_SECRET_ACCESS_KEY  (masked)
#   AWS_REGION             optional, defaults to eu-west-1
#
# IAM: ssm:GetParameter on /test-k8s/* , plus S3 sync and CloudFront invalidation.

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      variables:
        DEPLOY_ENV: dev
        SSM_PREFIX: /test-k8s/dev
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"
      variables:
        DEPLOY_ENV: prod
        SSM_PREFIX: /test-k8s/prod
    - if: $CI_COMMIT_TAG
      variables:
        DEPLOY_ENV: prod
        SSM_PREFIX: /test-k8s/prod

stages:
  - build
  - deploy

variables:
  PROJECT_NAME: test-k8s
  AWS_DEFAULT_REGION: $AWS_REGION
  AWS_REGION: eu-west-1
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

build:
  stage: build
  image: node:20-bookworm
  cache:
    key: "${CI_COMMIT_REF_SLUG}-npm"
    paths:
      - .npm/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends awscli
  script:
    - |
      ssm_get() {
        val=$(aws ssm get-parameter --name "${SSM_PREFIX}/$1" --query Parameter.Value --output text)
        if [ -z "$val" ] || [ "$val" = "None" ]; then
          echo "Missing SSM parameter: ${SSM_PREFIX}/$1" >&2
          exit 1
        fi
        printf '%s' "$val"
      }
      export VITE_API_URL
      VITE_API_URL=$(ssm_get api_url)
      case "$VITE_API_URL" in
        http://*|https://*) ;;
        *) VITE_API_URL="https://${VITE_API_URL}" ;;
      esac
      echo "VITE_API_URL=${VITE_API_URL}"

      COGNITO_CLIENT_ID=$(aws ssm get-parameter --name "${SSM_PREFIX}/cognito_client_id" --query Parameter.Value --output text 2>/dev/null || true)
      COGNITO_DOMAIN=$(aws ssm get-parameter --name "${SSM_PREFIX}/cognito_domain" --query Parameter.Value --output text 2>/dev/null || true)
      if [ -n "${COGNITO_CLIENT_ID}" ] && [ "${COGNITO_CLIENT_ID}" != "None" ]; then
        export VITE_COGNITO_CLIENT_ID="${COGNITO_CLIENT_ID}"
      fi
      if [ -n "${COGNITO_DOMAIN}" ] && [ "${COGNITO_DOMAIN}" != "None" ]; then
        case "$COGNITO_DOMAIN" in
          http://*|https://*) ;;
          *)
            COGNITO_DOMAIN="https://${COGNITO_DOMAIN}.auth.${AWS_REGION:-eu-west-1}.amazoncognito.com"
            ;;
        esac
        export VITE_COGNITO_DOMAIN="${COGNITO_DOMAIN}"
      fi
    - npm ci
    - npm run build
  artifacts:
    name: "site-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/
    expire_in: 1 day

deploy:
  stage: deploy
  image: alpine:3.21
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - when: manual
  environment:
    name: $DEPLOY_ENV
  resource_group: deploy-s3-$DEPLOY_ENV
  before_script:
    - apk add --no-cache aws-cli
  script:
    - test -d dist
    - |
      ssm_get() {
        val=$(aws ssm get-parameter --name "${SSM_PREFIX}/$1" --query Parameter.Value --output text)
        if [ -z "$val" ] || [ "$val" = "None" ]; then
          echo "Missing SSM parameter: ${SSM_PREFIX}/$1" >&2
          exit 1
        fi
        printf '%s' "$val"
      }
      BUCKET=$(ssm_get site_bucket_name)
      DISTRIBUTION_ID=$(ssm_get cloudfront_distribution_id)
      echo "Deploy target: s3://${BUCKET} / CloudFront ${DISTRIBUTION_ID}"
      aws s3 sync dist/ "s3://${BUCKET}" --delete
      aws cloudfront create-invalidation \
        --distribution-id "${DISTRIBUTION_ID}" \
        --paths "/*"
