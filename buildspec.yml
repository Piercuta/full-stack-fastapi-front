version: 0.2
env:
    shell: bash
phases:
  install:
    runtime-versions:
      nodejs: "20"
    commands:
      - npm install
  build:
    commands:
      - npm run build
  post_build:
    commands:
      - ls -a
      - aws s3 sync dist/ s3://${BUCKET_NAME} --delete
      - aws cloudfront create-invalidation --distribution-id ${DISTRIBUTION_ID} --paths '/*'
