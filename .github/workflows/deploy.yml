# Build the Vite site, pass dist/ as an artifact, then sync to S3 and
# invalidate CloudFront. Infra values come from SSM Parameter Store:
#   /<project>/<env>/<key>  e.g. /test-k8s/dev/site_bucket_name
#
#   push `dev`              → build + deploy automatically (environment `dev`)
#   push `master` / `main`  → build only
#   Run workflow on `master` / `main` / tag → build + deploy (manual prod release)
#
# Secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# Vars (optional):
#   AWS_REGION               defaults to eu-west-1
#
# IAM: ssm:GetParameter on /test-k8s/* , plus S3 sync and CloudFront invalidation.

name: Build and deploy to S3

on:
  push:
    branches:
      - master
      - main
      - dev
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: test-k8s
  DEPLOY_ENV: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
  SSM_PREFIX: ${{ github.ref_name == 'dev' && '/test-k8s/dev' || '/test-k8s/prod' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Read SSM api_url
        run: |
          ssm_get() {
            val=$(aws ssm get-parameter --name "${SSM_PREFIX}/$1" --query Parameter.Value --output text)
            if [ -z "$val" ] || [ "$val" = "None" ]; then
              echo "Missing SSM parameter: ${SSM_PREFIX}/$1" >&2
              exit 1
            fi
            printf '%s' "$val"
          }
          VITE_API_URL=$(ssm_get api_url)
          case "$VITE_API_URL" in
            http://*|https://*) ;;
            *) VITE_API_URL="https://${VITE_API_URL}" ;;
          esac
          echo "VITE_API_URL=${VITE_API_URL}" >> "$GITHUB_ENV"
          echo "VITE_API_URL=${VITE_API_URL}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
    concurrency:
      group: deploy-s3-${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
      cancel-in-progress: false
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Sync to S3 and invalidate CloudFront
        run: |
          test -d dist
          ssm_get() {
            val=$(aws ssm get-parameter --name "${SSM_PREFIX}/$1" --query Parameter.Value --output text)
            if [ -z "$val" ] || [ "$val" = "None" ]; then
              echo "Missing SSM parameter: ${SSM_PREFIX}/$1" >&2
              exit 1
            fi
            printf '%s' "$val"
          }
          BUCKET=$(ssm_get site_bucket_name)
          DISTRIBUTION_ID=$(ssm_get cloudfront_distribution_id)
          echo "Deploy target: s3://${BUCKET} / CloudFront ${DISTRIBUTION_ID}"
          aws s3 sync dist/ "s3://${BUCKET}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*"
