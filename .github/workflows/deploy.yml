# Build the Vite site, pass dist/ as an artifact, then sync to S3 and
# invalidate CloudFront. Infra values come from SSM Parameter Store:
#   /<project>/<env>/<key>  e.g. /test-k8s/dev/site_bucket_name
#
# Triggers (aligned with backend CI):
#   push `dev`         → build + deploy (environment `dev`)
#   push tag on `prod` → build + deploy (environment `prod`)
#   workflow_dispatch  → build + deploy (env from ref: `dev` → dev, else prod)
#
# Vars:
#   AWS_ROLE_ARN
#   AWS_REGION               defaults to eu-west-1
#
# IAM: ssm:GetParameter on /test-k8s/* , plus S3 sync and CloudFront invalidation.

name: Build and deploy to S3

on:
  push:
    branches:
      - dev
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_NAME: test-k8s
  DEPLOY_ENV: ${{ github.ref_name == 'dev' && 'dev' || 'prod' }}
  SSM_PREFIX: ${{ github.ref_name == 'dev' && '/test-k8s/dev' || '/test-k8s/prod' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'prod' || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on prod branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch origin prod:refs/remotes/origin/prod
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/prod; then
            echo "Refusing prod deploy: tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on branch prod." >&2
            echo "Create the tag from prod, e.g.: git checkout prod && git tag v1.2.3 && git push origin v1.2.3" >&2
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is on origin/prod — OK for prod deploy."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Read SSM api_url
        run: |
          ssm_get() {
            val=$(aws ssm get-parameter --name "${SSM_PREFIX}/$1" --query Parameter.Value --output text)
            if [ -z "$val" ] || [ "$val" = "None" ]; then
              echo "Missing SSM parameter: ${SSM_PREFIX}/$1" >&2
              exit 1
            fi
            printf '%s' "$val"
          }
          VITE_API_URL=$(ssm_get api_url)
          case "$VITE_API_URL" in
            http://*|https://*) ;;
            *) VITE_API_URL="https://${VITE_API_URL}" ;;
          esac
          echo "VITE_API_URL=${VITE_API_URL}" >> "$GITHUB_ENV"
          echo "VITE_API_URL=${VITE_API_URL}"

          COGNITO_CLIENT_ID=$(aws ssm get-parameter --name "${SSM_PREFIX}/cognito_client_id" --query Parameter.Value --output text 2>/dev/null || true)
          COGNITO_DOMAIN=$(aws ssm get-parameter --name "${SSM_PREFIX}/cognito_domain" --query Parameter.Value --output text 2>/dev/null || true)
          if [ -n "${COGNITO_CLIENT_ID}" ] && [ "${COGNITO_CLIENT_ID}" != "None" ]; then
            echo "VITE_COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}" >> "$GITHUB_ENV"
          fi
          if [ -n "${COGNITO_DOMAIN}" ] && [ "${COGNITO_DOMAIN}" != "None" ]; then
            case "$COGNITO_DOMAIN" in
              http://*|https://*) ;;
              *)
                REGION="${AWS_REGION:-eu-west-1}"
                COGNITO_DOMAIN="https://${COGNITO_DOMAIN}.auth.${REGION}.amazoncognito.com"
                ;;
            esac
            echo "VITE_COGNITO_DOMAIN=${COGNITO_DOMAIN}" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.ref_name == 'dev' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref_type == 'tag' && 'prod' || github.ref_name }}
    concurrency:
      group: deploy-s3-${{ github.ref_type == 'tag' && 'prod' || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Sync to S3 and invalidate CloudFront
        run: |
          test -d dist
          ssm_get() {
            val=$(aws ssm get-parameter --name "${SSM_PREFIX}/$1" --query Parameter.Value --output text)
            if [ -z "$val" ] || [ "$val" = "None" ]; then
              echo "Missing SSM parameter: ${SSM_PREFIX}/$1" >&2
              exit 1
            fi
            printf '%s' "$val"
          }
          BUCKET=$(ssm_get site_bucket_name)
          DISTRIBUTION_ID=$(ssm_get cloudfront_distribution_id)
          echo "Deploy target: s3://${BUCKET} / CloudFront ${DISTRIBUTION_ID}"
          aws s3 sync dist/ "s3://${BUCKET}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*"
